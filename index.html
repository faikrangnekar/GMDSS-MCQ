<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GMDSS MCQ Test - Home</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body id="home-page">
  <div class="page-wrapper">
    <div class="home-card">
      <div class="brand-logo">Distress Learning</div>
      <h1 class="main-title">GMDSS MCQ TEST</h1>
      <p class="subtitle">A practice test platform for the Global Maritime Distress and Safety System examination.</p>

      <form id="start-form" novalidate>
        <div class="field-group">
          <label for="candidate-name">Candidate Name</label>
          <input
            type="text"
            id="candidate-name"
            placeholder="Enter your full name"
            autocomplete="name"
            maxlength="50"
          />
          <div id="name-error" class="form-error" hidden>Please enter your name before starting the test.</div>
        </div>

        <div class="field-group">
          <label for="test-set">Test Set</label>
          <select id="test-set"></select>
        </div>

        <button type="submit" id="start-btn" class="btn btn-primary btn-block">Start Test</button>
      </form>

      <button type="button" id="logoutBtn" class="btn btn-outline btn-block" hidden>Logout</button>

      <p class="small-note">30 questions &middot; 30 minutes &middot; Select the best answer for each question.</p>

      <p class="small-note" id="account-note" hidden></p>

      <p class="auth-switch">
        <a href="login.html">Log in</a> &middot; <a href="signup.html">Create an account</a>
      </p>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="admin-config.js?v=2"></script>
  <script src="questions.js?v=2"></script>
  <script src="script.js?v=2"></script>
</body>
</html>
