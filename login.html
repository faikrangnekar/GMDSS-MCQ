<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GMDSS MCQ Test - Login</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body id="login-page">
  <div class="page-wrapper">
    <div class="home-card auth-card">
      <div class="brand-logo">Distress Learning</div>
      <h1 class="main-title">LOGIN</h1>
      <p class="subtitle">Sign in to continue to the GMDSS MCQ test platform.</p>

      <form id="login-form" novalidate>
        <div class="field-group">
          <label for="login-email">Email Address</label>
          <input
            type="email"
            id="login-email"
            placeholder="you@example.com"
            autocomplete="username"
            maxlength="100"
          />
        </div>

        <div class="field-group">
          <label for="login-password">Password</label>
          <div class="password-wrap">
            <input
              type="password"
              id="login-password"
              placeholder="Enter your password"
              autocomplete="current-password"
              maxlength="72"
            />
            <button
              type="button"
              id="toggle-password"
              class="password-toggle"
              aria-pressed="false"
              aria-controls="login-password"
            >Show</button>
          </div>
        </div>

        <p class="auth-forgot"><a href="reset-password.html">Forgot password?</a></p>

        <div class="checkbox-row">
          <input type="checkbox" id="remember-me" />
          <label for="remember-me">Remember Me</label>
        </div>

        <div id="auth-message" class="form-error" role="alert" hidden></div>

        <button type="submit" id="login-btn" class="btn btn-primary btn-block">Log In</button>
      </form>

      <p class="auth-switch">Don't have an account? <a href="signup.html">Create an Account</a></p>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="admin-config.js"></script>
  <script src="auth.js"></script>
</body>
</html>
