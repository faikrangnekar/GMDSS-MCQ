<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GMDSS MCQ Test - Reset Password</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body id="reset-page">
  <div class="page-wrapper">
    <div class="home-card auth-card">
      <div class="brand-logo">Distress Learning</div>

      <!-- ==================== REQUEST RESET LINK ==================== -->
      <div id="request-reset-section">
        <h1 class="main-title">RESET PASSWORD</h1>
        <p class="subtitle">Enter your account email and we'll send you a reset link.</p>

        <form id="request-reset-form" novalidate>
          <div class="field-group">
            <label for="reset-email">Email Address</label>
            <input
              type="email"
              id="reset-email"
              placeholder="you@example.com"
              autocomplete="email"
              maxlength="100"
            />
          </div>

          <div id="reset-message" class="form-error" role="alert" hidden></div>

          <button type="submit" id="request-reset-btn" class="btn btn-primary btn-block">Send Reset Link</button>
        </form>

        <p class="auth-switch">Remembered it? <a href="login.html">Back to login</a></p>
      </div>

      <!-- ==================== SET NEW PASSWORD ==================== -->
      <div id="set-password-section" hidden>
        <h1 class="main-title">SET NEW PASSWORD</h1>
        <p class="subtitle">Choose a new password for your account.</p>

        <form id="set-password-form" novalidate>
          <div class="field-group">
            <label for="new-password">New Password</label>
            <input
              type="password"
              id="new-password"
              placeholder="At least 6 characters"
              autocomplete="new-password"
              maxlength="72"
            />
          </div>

          <div class="field-group">
            <label for="confirm-password">Confirm New Password</label>
            <input
              type="password"
              id="confirm-password"
              placeholder="Re-enter your new password"
              autocomplete="new-password"
              maxlength="72"
            />
          </div>

          <div id="set-message" class="form-error" role="alert" hidden></div>

          <button type="submit" id="set-password-btn" class="btn btn-primary btn-block">Update Password</button>
        </form>

        <p class="auth-switch">Back to <a href="login.html">login</a></p>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="admin-config.js?v=2"></script>
  <script src="auth.js?v=2"></script>
</body>
</html>
